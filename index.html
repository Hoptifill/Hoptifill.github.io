<style>
  :root{
    --bg:#06070d; --ink:#eceff5; --ink-soft:#c3c9d6; --muted:#868ea0;
    --line:rgba(255,255,255,.09); --line-soft:rgba(255,255,255,.055);
    --panel:rgba(255,255,255,.035); --panel-2:rgba(255,255,255,.06);
    --a1:#4f7cff; --a2:#8b5cff; --a-ink:#9db4ff;
    --ship:#33d17a; --wip:#ffb340; --con:#868ea0;
    --grad:linear-gradient(135deg,#4f7cff,#8b5cff);
    --max:1060px;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{
    background:var(--bg);color:var(--ink);
    font-family:"IBM Plex Sans",system-ui,sans-serif;font-weight:400;line-height:1.55;
    -webkit-font-smoothing:antialiased;overflow-x:hidden;position:relative;
  }
  body::before{
    content:"";position:fixed;inset:0;z-index:0;pointer-events:none;
    background:
      radial-gradient(48% 34% at 12% 0%,rgba(79,124,255,.22),transparent 68%),
      radial-gradient(42% 40% at 92% 6%,rgba(139,92,255,.20),transparent 70%),
      radial-gradient(55% 45% at 60% 108%,rgba(79,124,255,.10),transparent 72%);
  }
  .mono{font-family:"IBM Plex Mono",monospace}
  .wrap{max-width:var(--max);margin:0 auto;padding:0 28px;position:relative;z-index:1}
  a{color:inherit;text-decoration:none}

  header{position:sticky;top:0;z-index:50;
    background:rgba(6,7,13,.72);backdrop-filter:blur(12px);border-bottom:1px solid var(--line-soft)}
  .bar{display:flex;align-items:center;justify-content:space-between;height:60px}
  .monogram{font-family:"Archivo",sans-serif;font-weight:800;letter-spacing:-.02em;font-size:16px;
    display:flex;align-items:center;gap:9px}
  .monogram .dot{width:10px;height:10px;border-radius:3px;background:var(--grad)}
  .monogram .d2{color:var(--muted)}
  nav.links{display:flex;align-items:center;gap:24px}
  nav.links a{font-family:"IBM Plex Mono",monospace;font-size:12.5px;color:var(--muted);transition:color .18s}
  nav.links a:hover{color:var(--ink)}
  .toggle{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;
    font-family:"IBM Plex Mono",monospace;font-size:12px}
  .toggle button{background:transparent;border:0;cursor:pointer;padding:6px 11px;color:var(--muted);font:inherit;transition:.16s}
  .toggle button.on{background:var(--grad);color:#fff}
  @media(max-width:720px){.bar{height:auto;min-height:60px;flex-wrap:wrap;padding:8px 0;gap:6px}nav.links{gap:12px;flex-wrap:wrap}nav.links a{font-size:11.5px}}

  .hero{padding:88px 0 64px;position:relative;border-bottom:1px solid var(--line-soft)}
  .eyebrow{font-family:"IBM Plex Mono",monospace;font-size:12px;letter-spacing:.06em;color:var(--a-ink);
    text-transform:uppercase;margin-bottom:24px;display:inline-flex;align-items:center;gap:10px}
  .eyebrow::before{content:"";width:28px;height:1px;background:var(--grad)}
  h1.name{font-family:"Archivo",sans-serif;font-weight:800;font-size:clamp(46px,9vw,92px);
    line-height:.95;letter-spacing:-.035em;margin-bottom:22px}
  h1.name .g{background:var(--grad);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
  .thesis{font-size:clamp(18px,2.4vw,23px);max-width:680px;color:var(--ink-soft);font-weight:450;line-height:1.45;margin-bottom:14px}
  .subline{font-size:15.5px;color:var(--muted);max-width:620px;margin-bottom:34px}
  .metarow{display:flex;flex-wrap:wrap;gap:10px;font-family:"IBM Plex Mono",monospace;font-size:12.5px}
  .metarow a,.metarow span{border:1px solid var(--line);background:var(--panel);padding:8px 13px;border-radius:9px;
    color:var(--ink-soft);display:inline-flex;align-items:center;gap:8px;transition:.16s}
  .metarow a:hover{border-color:transparent;background:var(--panel-2);box-shadow:inset 0 0 0 1px rgba(139,92,255,.5);color:#fff}
  .metarow .k{color:var(--a-ink)}

  section.block{padding:72px 0;border-bottom:1px solid var(--line-soft)}
  .sechead{display:flex;align-items:baseline;justify-content:space-between;gap:20px;margin-bottom:38px;flex-wrap:wrap}
  .sechead .lead{display:flex;align-items:baseline;gap:16px}
  .sechead .idx{font-family:"IBM Plex Mono",monospace;font-size:13px;
    background:var(--grad);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
  .sechead h2{font-family:"Archivo",sans-serif;font-weight:700;font-size:clamp(26px,3.6vw,34px);letter-spacing:-.02em}
  .sechead .note{font-family:"IBM Plex Mono",monospace;font-size:12px;color:var(--muted)}

  .cards{display:flex;flex-direction:column;gap:18px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:16px;overflow:hidden;
    backdrop-filter:blur(8px);transition:border-color .2s,transform .2s,box-shadow .2s}
  .card:hover{border-color:rgba(139,92,255,.45);transform:translateY(-2px);box-shadow:0 16px 44px -26px rgba(79,124,255,.7)}
  .card .spec{display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding:13px 20px;border-bottom:1px solid var(--line-soft);
    font-family:"IBM Plex Mono",monospace;font-size:12px;color:var(--muted)}
  .card .pid{background:var(--grad);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;font-weight:500}
  .status{display:inline-flex;align-items:center;gap:7px}
  .status .sd{width:8px;height:8px;border-radius:50%}
  .sd.ship{background:var(--ship);box-shadow:0 0 8px var(--ship)} .sd.wip{background:var(--wip);box-shadow:0 0 8px var(--wip)} .sd.con{background:var(--con)}
  .card .spec .spacer{flex:1}
  .card .body{padding:22px 20px 24px;display:grid;grid-template-columns:1.35fr 1fr;gap:26px}
  @media(max-width:680px){.card .body{grid-template-columns:1fr;gap:18px}}
  .card h3{font-family:"Archivo",sans-serif;font-weight:700;font-size:23px;letter-spacing:-.01em;margin-bottom:10px}
  .card p.desc{font-size:15px;color:var(--ink-soft);line-height:1.5}
  .feats{list-style:none;display:flex;flex-direction:column;gap:9px}
  .feats li{font-family:"IBM Plex Mono",monospace;font-size:12.5px;color:var(--ink-soft);
    padding-left:18px;position:relative;line-height:1.45}
  .feats li::before{content:"→";position:absolute;left:0;color:var(--a-ink)}
  .chips{display:flex;flex-wrap:wrap;gap:7px;margin-top:16px}
  .chip{font-family:"IBM Plex Mono",monospace;font-size:11.5px;border:1px solid var(--line);border-radius:7px;padding:4px 9px;color:var(--muted)}
  .cardlink{display:inline-flex;align-items:center;gap:8px;margin-top:16px;font-family:"IBM Plex Mono",monospace;
    font-size:12.5px;color:var(--a-ink);border-bottom:1px solid transparent;transition:.16s;padding-bottom:1px}
  .cardlink:hover{border-color:var(--a2)}
  button.cardlink{background:transparent;cursor:pointer}

  /* modal */
  .modal{position:fixed;inset:0;z-index:100;display:none;align-items:flex-start;justify-content:center;
    background:rgba(4,5,10,.72);backdrop-filter:blur(6px);padding:40px 20px;overflow-y:auto}
  .modal.open{display:flex}
  .m-panel{position:relative;width:100%;max-width:760px;background:#0c0e17;border:1px solid var(--line);
    border-radius:18px;padding:26px 26px 30px;box-shadow:0 30px 80px -20px rgba(0,0,0,.8)}
  .m-close{position:absolute;top:14px;right:14px;width:34px;height:34px;border-radius:9px;cursor:pointer;
    background:var(--panel-2);border:1px solid var(--line);color:var(--ink);font-size:14px;transition:.16s}
  .m-close:hover{border-color:var(--a2);color:#fff}
  .m-spec{display:flex;align-items:center;gap:12px;font-family:"IBM Plex Mono",monospace;font-size:12px;color:var(--muted);margin-bottom:10px}
  .m-spec .spacer{flex:1}
  .m-title{font-family:"Archivo",sans-serif;font-weight:700;font-size:26px;letter-spacing:-.01em;margin-bottom:12px}
  .m-desc{font-size:15px;color:var(--ink-soft);line-height:1.55;margin-bottom:14px}
  .m-lbl{font-family:"IBM Plex Mono",monospace;font-size:11px;letter-spacing:.06em;text-transform:uppercase;
    color:var(--muted);margin:22px 0 12px;padding-bottom:8px;border-bottom:1px solid var(--line-soft)}
  .m-gallery{display:flex;flex-direction:column;gap:14px}
  .m-gallery img{width:100%;border-radius:12px;border:1px solid var(--line);display:block}
  .m-soon{font-size:13.5px;color:var(--muted);font-style:italic;padding:8px 0}
  .m-gallery.has .m-soon{display:none}
  .m-panel .cardlink{margin-top:20px}

  .also{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:22px}
  @media(max-width:680px){.also{grid-template-columns:1fr}}
  .also .item{border:1px dashed var(--line);border-radius:12px;padding:16px;background:var(--panel)}
  .also .item .t{font-family:"Archivo",sans-serif;font-weight:600;font-size:15.5px;margin-bottom:6px}
  .also .item .d{font-size:13px;color:var(--muted);line-height:1.45}

  /* AI workflow */
  .aigrid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}
  @media(max-width:680px){.aigrid{grid-template-columns:1fr}}
  .ai{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:20px;backdrop-filter:blur(8px)}
  .ai .tp{display:flex;align-items:center;gap:10px;margin-bottom:9px}
  .ai .tp .tool{font-family:"Archivo",sans-serif;font-weight:700;font-size:16px}
  .ai .tp .role{font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--a-ink);
    border:1px solid var(--line);border-radius:20px;padding:3px 9px;margin-left:auto}
  .ai p{font-size:14px;color:var(--ink-soft);line-height:1.5}

  .stackgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:26px}
  .stackgroup .gl{font-family:"IBM Plex Mono",monospace;font-size:12px;letter-spacing:.05em;text-transform:uppercase;
    color:var(--muted);margin-bottom:13px;padding-bottom:9px;border-bottom:1px solid var(--line)}
  .stackgroup ul{list-style:none;display:flex;flex-direction:column;gap:8px}
  .stackgroup li{font-size:14.5px;color:var(--ink-soft);display:flex;align-items:center;gap:9px}
  .stackgroup li::before{content:"";width:5px;height:5px;border-radius:1px;background:var(--grad);flex:none}

  .objtxt{font-size:16px;color:var(--ink-soft);max-width:620px;margin-bottom:26px;line-height:1.55}
  .road{display:flex;flex-wrap:wrap;gap:10px}
  .rstep{display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--line);
    border-radius:10px;padding:9px 14px;font-family:"IBM Plex Mono",monospace;font-size:12.5px;color:var(--ink-soft)}
  .rstep .n{color:var(--a-ink)}
  .rstep .arrow{color:var(--muted);margin:0 2px}

  .edugrid{display:grid;grid-template-columns:1.3fr 1fr;gap:30px}
  @media(max-width:680px){.edugrid{grid-template-columns:1fr;gap:22px}}
  .edu .l{font-family:"IBM Plex Mono",monospace;font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin-bottom:14px}
  .edu .entry{margin-bottom:16px}
  .edu .deg{font-family:"Archivo",sans-serif;font-weight:600;font-size:17px;margin-bottom:4px}
  .edu .meta{font-family:"IBM Plex Mono",monospace;font-size:12px;color:var(--muted)}
  .langline{font-size:14.5px;color:var(--ink-soft)}

  footer{padding:80px 0 58px}
  .cta h2{font-family:"Archivo",sans-serif;font-weight:800;font-size:clamp(30px,5.4vw,54px);letter-spacing:-.03em;line-height:1;margin-bottom:14px}
  .cta h2 .g{background:var(--grad);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
  .cta .subcta{color:var(--muted);margin-bottom:26px;max-width:460px}
  .foot-fine{margin-top:44px;font-family:"IBM Plex Mono",monospace;font-size:11.5px;color:var(--muted);
    display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px}

  @media(prefers-reduced-motion:no-preference){
    .rv{opacity:0;transform:translateY(14px);transition:opacity .6s ease,transform .6s ease}
    .rv.in{opacity:1;transform:none}
  }
  :focus-visible{outline:2px solid var(--a2);outline-offset:3px;border-radius:4px}
  .wa{border-color:rgba(51,209,122,.5)!important}
  .filters{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:22px}
  .filters button{font-family:"IBM Plex Mono",monospace;font-size:12px;border:1px solid var(--line);background:var(--panel);color:var(--ink-soft);padding:8px 13px;border-radius:9px;cursor:pointer;transition:.16s}
  .filters button.on{background:var(--grad);color:#fff;border-color:transparent}
  .tpls{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px}
  .tpl{background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden;transition:.2s}
  .tpl:hover{border-color:rgba(139,92,255,.45);transform:translateY(-2px)}
  .tpl .sw{height:96px}.tpl .tb{padding:16px}.tpl h3{font-family:"Archivo",sans-serif;font-size:18px;margin:4px 0 6px}
  .tpl .lv{font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--a-ink)}.tpl p{font-size:13.5px;color:var(--muted)}
  .tpl .acts{display:flex;gap:14px;flex-wrap:wrap;margin-top:6px}
</style>
</head>

// con estos nombres exactos. Las que no existan se ocultan solas.
const SHOTS = {
  'LinkStart':['linkstart-1.png','linkstart-2.png','linkstart-3.png','linkstart-4.png','linkstart-5.png','linkstart-6.png'],
  'Plataforma LMS':['lms-1.png','lms-2.png','lms-3.png','lms-4.png'],
  'LMS Platform':['lms-1.png','lms-2.png','lms-3.png','lms-4.png'],
  'Web Tools Hub':['webtools-1.png','webtools-2.png','webtools-3.png','webtools-4.png']
};
let curLang = 'es';

function render(lang){
  const d = Object.assign({}, DATA.es, DATA[lang]);
  curLang = lang;
  document.documentElement.lang = lang;
  document.querySelectorAll('[data-k]').forEach(el=>{
    const k = el.getAttribute('data-k'); if(d[k]!==undefined) el.textContent = d[k];
  });
  document.getElementById('cards').innerHTML = d.projects.map((p,i)=>`
    <article class="card">
      <div class="spec"><span class="pid">${p.id}</span>
        <span class="status"><span class="sd ${p.status}"></span>${p.statusTxt}</span>
        <span class="spacer"></span><span>${p.year}</span></div>
      <div class="body">
        <div><h3>${p.title}</h3><p class="desc">${p.desc}</p>
          <div class="chips">${p.chips.map(c=>`<span class="chip">${c}</span>`).join('')}</div>
          ${SHOTS[p.title]
            ? `<button class="cardlink" onclick="openProject(${i})">${d.view_details} →</button>`
            : (p.url && p.url.startsWith('http')
                ? `<a class="cardlink" href="${p.url}" target="_blank" rel="noopener">${p.link} →</a>`
                : '')}
        </div>
        <ul class="feats">${p.feats.map(f=>`<li>${f}</li>`).join('')}</ul>
      </div>
    </article>`).join('');
  document.getElementById('srv').innerHTML = d.srvs.map(a=>`<div class="item"><div class="t">${a.t}</div><div class="d">${a.d}</div></div>`).join('');
  drawCat(d);
  document.getElementById('also').innerHTML = d.also.map(a=>`
    <div class="item"><div class="t">${a.t}</div><div class="d">${a.d}</div></div>`).join('');
  document.getElementById('aigrid').innerHTML = d.ai.map(a=>`
    <div class="ai"><div class="tp"><span class="tool">${a.tool}</span><span class="role">${a.role}</span></div><p>${a.p}</p></div>`).join('');
  document.getElementById('stackgrid').innerHTML = d.stack.map(s=>`
    <div class="stackgroup"><div class="gl">${s.g}</div><ul>${s.items.map(i=>`<li>${i}</li>`).join('')}</ul></div>`).join('');
  document.getElementById('road').innerHTML = d.road.map((r,i)=>`
    <div class="rstep"><span class="n">0${i+1}</span>${r}${i<d.road.length-1?'<span class="arrow">→</span>':''}</div>`).join('');
  document.getElementById('edu-list').innerHTML =
    `<div class="l">${lang==='es'?'Formación':'Studies'}</div>` +
    d.edu.map(e=>`<div class="entry"><div class="deg">${e.deg}</div><div class="meta">${e.meta}</div></div>`).join('');
}
function setLang(lang){
  render(lang);
  document.getElementById('es').classList.toggle('on',lang==='es');
  document.getElementById('en').classList.toggle('on',lang==='en');
}

function openProject(i){
  const d = Object.assign({}, DATA.es, DATA[curLang]);
  const p = d.projects[i];
  const shots = SHOTS[p.title] || [];
  const gallery = shots.map(src=>
    `<img src="${src}" alt="${p.title}" loading="lazy" onload="this.closest('.m-gallery').classList.add('has')" onerror="this.remove()">`
  ).join('');
  document.getElementById('m-body').innerHTML = `
    <div class="m-spec"><span class="status"><span class="sd ${p.status}"></span>${p.statusTxt}</span>
      <span class="spacer"></span><span>${p.year}</span></div>
    <h3 class="m-title">${p.title}</h3>
    <p class="m-desc">${p.desc}</p>
    <div class="chips">${p.chips.map(c=>`<span class="chip">${c}</span>`).join('')}</div>
    <div class="m-lbl">${d.modal_shots}</div>
    <div class="m-gallery">${gallery}<div class="m-soon">${d.shots_soon}</div></div>
    ${p.url && p.url.startsWith('http') ? `<a class="cardlink" href="${p.url}" target="_blank" rel="noopener">${p.link} →</a>` : ''}`;
  const m = document.getElementById('modal');
  m.classList.add('open'); document.body.style.overflow='hidden';
  document.getElementById('m-close').setAttribute('aria-label', d.close);
}
function closeProject(){ document.getElementById('modal').classList.remove('open'); document.body.style.overflow=''; }
document.addEventListener('keydown',e=>{ if(e.key==='Escape') closeProject(); });

const TPL=[
 {l:1,n:"Gradient",r:"Apps, emprendedores, servicios tech",f:"landing-gradient.html",c:"linear-gradient(135deg,#6a5cff,#ff5ca8)"},
 {l:1,n:"Minimalista",r:"Inmobiliarias, estudios, profesionales",f:"landing-minimal.html",c:"linear-gradient(135deg,#d9d6cc,#fafaf7)"},
 {l:2,n:"Coquette / pastel",r:"Estética, peluquerías, indumentaria",f:"multi-coquette.html",c:"linear-gradient(135deg,#ffd6e0,#e98aa6)"},
 {l:2,n:"Corporativo",r:"Pymes, servicio técnico, consultoras",f:"multi-corporativo.html",c:"linear-gradient(135deg,#14213d,#1f4fd8)"},
 {l:3,n:"Tienda con carrito",r:"Comercios · pedido directo a WhatsApp",f:"db-tienda.html",c:"linear-gradient(135deg,#16a34a,#e2e8f0)"},
 {l:3,n:"Turnos y reservas",r:"Barberías, canchas, consolas",f:"db-turnos.html",c:"linear-gradient(135deg,#f59e0b,#0f1115)"}];
let catF=0;
function drawCat(d){
  document.getElementById('filters').innerHTML=[0,1,2,3].map(i=>`<button class="${i===catF?'on':''}" onclick="catF=${i};drawCat(Object.assign({},DATA.es,DATA[curLang]))">${d['f'+i]}</button>`).join('');
  document.getElementById('tpls').innerHTML=TPL.map((t,i)=>catF&&t.l!==catF?'':`<div class="tpl"><div class="sw" style="background:${t.c}"></div><div class="tb"><span class="lv">${d['f'+t.l]}</span><h3>${t.n}</h3><p>${t.r}</p><div class="acts"><button class="cardlink" onclick="openPv(${i})">${d.see} →</button><a class="cardlink" target="_blank" rel="noopener" href="${wa(t)}">${d.want}</a></div></div></div>`).join('');
}
function wa(t){return 'https://wa.me/5491124063177?text='+encodeURIComponent('Hola! Vi el catálogo de Hoptifill y me interesa el estilo "'+t.n+'" para mi web.')}
function openPv(i){const t=TPL[i],d=Object.assign({},DATA.es,DATA[curLang]);
  document.getElementById('pv-t').textContent=t.n+' — '+t.r;document.getElementById('pv-f').src='catalogo/'+t.f;
  const a=document.getElementById('pv-w');a.href=wa(t);a.textContent=d.want+' →';
  document.getElementById('pv').classList.add('open');document.body.style.overflow='hidden'}
function closePv(){document.getElementById('pv').classList.remove('open');document.getElementById('pv-f').src='about:blank';document.body.style.overflow=''}
document.addEventListener('keydown',e=>{ if(e.key==='Escape') closePv(); });
render('es');
const io = new IntersectionObserver((es)=>{es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target)}})},{threshold:.12});
document.querySelectorAll('.rv').forEach(el=>io.observe(el));
</script>
