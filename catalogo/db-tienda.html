<!DOCTYPE html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tienda con catálogo y carrito</title>
<link rel="stylesheet" href="base.css"><style>:root{--bg:#f6f7f9;--ink:#16181d;--card:#fff;--ac:#16a34a;--r:12px;--ph:linear-gradient(135deg,#e2e8f0,#cbd5e1)}
.f{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}.f button{border:1px solid #cbd5e1;background:#fff;border-radius:99px;padding:7px 14px;cursor:pointer;font:inherit}.f .on{background:#16181d;color:#fff}
.pr{font-weight:800;font-size:18px;margin:4px 0 10px}#cart{position:sticky;bottom:0;background:#16181d;color:#fff;padding:12px 20px;display:flex;justify-content:space-between;align-items:center;gap:10px}</style>
<div class="w"><nav><b>🛍 Tienda Demo</b><span class="mut">Catálogo desde JSON</span></nav><div class="f" id="f"></div><div class="g3" id="g"></div><footer>Datos de ejemplo · en producción vienen de una base de datos</footer></div>
<div id="cart"><span id="t">Carrito vacío</span><a class="b" id="wa" href="#" target="_blank">Pedir por WhatsApp</a></div>
<script>const P=[{n:"Remera oversize",c:"Ropa",p:18500},{n:"Gorra trucker",c:"Ropa",p:9800},{n:"Mochila urbana",c:"Accesorios",p:32000},{n:"Botella térmica",c:"Accesorios",p:14500},{n:"Auriculares",c:"Tech",p:27000},{n:"Cargador 65W",c:"Tech",p:21000}];
let cat="Todo",K={};const $=i=>document.getElementById(i),m=n=>"$ "+n.toLocaleString("es-AR");
function draw(){$("f").innerHTML=["Todo",...new Set(P.map(x=>x.c))].map(c=>`<button class="${c==cat?"on":""}" onclick="cat='${c}';draw()">${c}</button>`).join("");
$("g").innerHTML=P.map((x,i)=>cat=="Todo"||x.c==cat?`<div class="c"><div class="ph"></div><h3>${x.n}</h3><div class="pr">${m(x.p)}</div><button class="b" onclick="K[${i}]=(K[${i}]||0)+1;draw()">Agregar${K[i]?" ("+K[i]+")":""}</button></div>`:"").join("");
const l=Object.keys(K).map(i=>`${K[i]}x ${P[i].n}`),s=Object.keys(K).reduce((a,i)=>a+K[i]*P[i].p,0);
$("t").textContent=l.length?`${l.length} producto(s) · ${m(s)}`:"Carrito vacío";$("wa").href="https://wa.me/?text="+encodeURIComponent("Hola! Quiero pedir:\n"+l.join("\n")+"\nTotal: "+m(s))}draw()</script></html>
